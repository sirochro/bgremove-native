[project]
name = "bgremove-native"
version = "0.1.0"
description = "Unified native desktop wrapper for rembg (image) + RVM (video) with DirectML acceleration"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "sirochro" }]

dependencies = [
    # Image (rembg)
    "rembg>=2.0.50",
    # Video (RVM)
    "onnxruntime-directml>=1.17.0",
    "numpy>=1.26.0",
    # cv2 (opencv-python-headless) for alpha post-process — its SIMD-tuned
    # GaussianBlur and morphology are 5-10x faster than scipy.ndimage for
    # the 1080p–4K sizes we hit per frame.
    "opencv-python-headless>=4.9.0",
    # Common
    "pywebview>=5.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    "pillow>=10.0.0",
    "sse-starlette>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
